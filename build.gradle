import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.darkhax.curseforgegradle.UploadArtifact

plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

boolean isNeo = minecraft_version == "1.21.1" || minecraft_version == "1.21.11"

configurations {
    shadow
    implementation.extendsFrom(shadow)
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate "com.llamalad7.mixinextras", "me.kall.duplicationless.mixinextras"
    mergeServiceFiles()
    archiveClassifier = "dev-shadow"
}

remapJar {
    dependsOn tasks.named("shadowJar")
    inputFile = shadowJar.archiveFile
    archiveClassifier = null
}

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"

base {
    archivesName = project.archives_name
}

loom {
    silentMojangMappingsLicense()

    if (!isNeo) {
        forge {
            mixinConfig 'duplicationless.mixins.json'
        }
    }
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

def versionMap = [
    "1.20.1": [forge: "47.4.2", parchment: "2023.09.03", java: "17"],
    "1.19.2": [forge: "43.5.0", parchment: "2022.11.27", java: "17"],
    "1.18.2": [forge: "40.3.10", parchment: "2022.11.06", java: "17"],
    "1.16.5": [forge: "36.2.42", parchment: "2022.03.06", java: "8"],
    "1.21.1": [neo  : "21.1.192", parchment: "2024.11.17", java: "21"],
    "1.21.11": [neo: "21.11.11", parchment: "", java: "21"]
]

Map<Integer, JavaVersion> javaVersionMap = new HashMap<>()

javaVersionMap.put(17, JavaVersion.VERSION_17)
javaVersionMap.put(8, JavaVersion.VERSION_1_8)
javaVersionMap.put(21, JavaVersion.VERSION_21)

LinkedHashMap<String, String> versionInfo = versionMap[minecraft_version]
if (versionInfo == null) throw new IllegalArgumentException("Unsupported version: ${minecraft_version}")

String forgeVersion = versionInfo.forge ?: ""
String parchmentVersion = versionInfo.parchment ?: ""
Integer javaVersionInt = Integer.parseInt(versionInfo.java ?: "")
JavaVersion javaVersion = javaVersionMap.get(javaVersionInt)

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    if (parchmentVersion.isBlank()) {
        mappings loom.officialMojangMappings()
    } else {
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${parchmentVersion}@zip")
        }
    }

    if (isNeo) {
        neoForge "net.neoforged:neoforge:${versionInfo.neo}"
    } else {
        forge "net.minecraftforge:forge:${project.minecraft_version}-${forgeVersion}"
    }

    if (!isNeo) {
        shadow(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    }
}

processResources {
    inputs.property 'version', project.version
    if (isNeo) {
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version
        }
        exclude("META-INF/mods.toml")
    } else {
        filesMatching('META-INF/mods.toml') {
            expand version: project.version
        }
        exclude("META-INF/neoforge.mods.toml")
    }
}

java {
    withSourcesJar()
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersionInt
}

String changelog = file("CHANGELOG.md").getText("UTF-8")

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    if (cf_project_id == "") throw new UnsupportedOperationException("Didn't define CurseForge project ID")
    apiToken = System.getenv("CURSEFORGE_TOKEN")
    disableVersionDetection()

    UploadArtifact mainFile = upload(cf_project_id, remapJar)
    mainFile.displayName = "${archives_name}-${version}"
    mainFile.releaseType = "release"
    mainFile.changelog = changelog
    mainFile.changelogType = "markdown"
    mainFile.addModLoader(isNeo ? "NeoForge" : "Forge")
    mainFile.addJavaVersion("Java " + javaVersionInt)
    mainFile.addGameVersion(minecraft_version)

    UploadArtifact sourcesFile = mainFile.withAdditionalFile(sourcesJar)
    sourcesFile.changelog = changelog
    sourcesFile.changelogType = "markdown"
}
