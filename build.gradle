import net.darkhax.curseforgegradle.TaskPublishCurseForge
import net.darkhax.curseforgegradle.UploadArtifact

plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT'
    id "com.gradleup.shadow" version "8.3.9"
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

boolean isNeo = loom.platform.get().toString() == "NEOFORGE"

configurations {
    shadow
    implementation.extendsFrom(shadow)
}

shadowJar {
    configurations = [project.configurations.shadow]
    relocate "com.llamalad7.mixinextras", "me.kall.${archives_name}.mixinextras"
    mergeServiceFiles()
    archiveClassifier = "dev-shadow"
    exclude "LICENSE_MixinExtras"
}

remapJar {
    dependsOn tasks.named("shadowJar")
    inputFile = shadowJar.archiveFile
    archiveClassifier = null
    exclude "LICENSE_MixinExtras"
}

group = project.maven_group
version = "${project.minecraft_version}-${project.mod_version}"

base {
    archivesName = project.archives_name
}

loom {
    silentMojangMappingsLicense()

    if (!isNeo) {
        forge {
            mixinConfig "${archives_name}.mixins.json"
        }
    }
}

repositories {
    maven { name = "ParchmentMC";    url = 'https://maven.parchmentmc.org' }
    maven { name = "MinecraftForge"; url = "https://files.minecraftforge.net/maven/" }
    maven { name = "NeoForged";      url = 'https://maven.neoforged.net/releases' }
    maven { name = "FabricMC";       url = "https://maven.fabricmc.net/" }
    maven { name = "Architectury";   url = "https://maven.architectury.dev/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

def versionMap = [
    "1.20.1" : [forge: "47.4.2"       , parchment: "2023.09.03"],
    "1.16.5" : [forge: "36.2.42"      , parchment: "2022.03.06"],
    "1.21.1" : [neo  : "21.1.218"     , parchment: "2024.11.17"],
    "1.21.11": [neo  : "21.11.30-beta", parchment: "2025.12.20"]
]

HashMap<String, String> versionInfo = versionMap[minecraft_version]

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${versionInfo.parchment}@zip")
    }

    if (isNeo) {
        neoForge "net.neoforged:neoforge:${versionInfo.neo}"
    } else {
        forge "net.minecraftforge:forge:${project.minecraft_version}-${versionInfo.forge}"
    }

    if (!isNeo) shadow(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
}

processResources {
    inputs.property 'version', project.version
    if (isNeo) {
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version
        }
        exclude("META-INF/mods.toml")
    } else {
        filesMatching('META-INF/mods.toml') {
            expand version: project.version
        }
        exclude("META-INF/neoforge.mods.toml")
    }
}

Map<String, JavaVersion> javaMap = new HashMap<>();

javaMap.put("1.20.1", JavaVersion.VERSION_17)
javaMap.put("1.16.5", JavaVersion.VERSION_1_8)
javaMap.put("1.21.1", JavaVersion.VERSION_21)
javaMap.put("1.21.11", JavaVersion.VERSION_21)

java {
    withSourcesJar()
    JavaVersion javaVer = javaMap.get(minecraft_version)
    sourceCompatibility = javaVer
    targetCompatibility = javaVer
}

Map<String, Integer> javaIntMap = new HashMap<>();

javaIntMap.put("1.20.1", 17)
javaIntMap.put("1.16.5", 8)
javaIntMap.put("1.21.1", 21)
javaIntMap.put("1.21.11", 21)

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaIntMap.get(minecraft_version)
}

String CHANGELOG = file("CHANGELOG.md").getText("UTF-8")

Map<String, String[]> supportedJavaMap = new HashMap<>();

supportedJavaMap.put("1.20.1", new String[]{"Java 17", "Java 21", "Java 22"})
supportedJavaMap.put("1.16.5", new String[]{"Java 8", "Java 17", "Java 21", "Java 22"})
supportedJavaMap.put("1.21.1", new String[]{"Java 21", "Java 22"})
supportedJavaMap.put("1.21.11", new String[]{"Java 21", "Java 22"})

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    if (cf_project_id.isEmpty()) {
        System.out.println("CurseForge Project ID: " + cf_project_id)
        apiToken = System.getenv("CURSEFORGE_TOKEN")
        disableVersionDetection()
    
        UploadArtifact mainFile = upload(cf_project_id, remapJar)
        mainFile.displayName = "${archives_name}-${version}"
        mainFile.releaseType = "release"
        mainFile.changelog = CHANGELOG
        mainFile.changelogType = "markdown"
        mainFile.addModLoader(isNeo ? "NeoForge" : "Forge")
        mainFile.addJavaVersion(supportedJavaMap.get(minecraft_version))
        mainFile.addGameVersion(minecraft_version)
    
        UploadArtifact sourcesFile = mainFile.withAdditionalFile(sourcesJar)
        sourcesFile.changelog = CHANGELOG
        sourcesFile.changelogType = "markdown"
    } else {
        System.err.println("CurseForge Project ID is not provided")
    }
}
