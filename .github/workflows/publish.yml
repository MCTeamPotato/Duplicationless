name: Publish Multi-Branch Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [1165, 1201, 1211, 12111]

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'adopt'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v5.0.1
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'build.gradle') }}

      - uses: gradle/actions/wrapper-validation@v3

      - name: Build and Publish
        run: |
          chmod +x gradlew
          ./gradlew build publishCurseForge publish --stacktrace --refresh-dependencies --no-build-cache -Porg.gradle.parallel.threads=4
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
